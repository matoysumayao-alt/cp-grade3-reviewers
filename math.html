<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math Reviewer</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;color:#183153;background:linear-gradient(180deg,#fff,#fff9fc);line-height:1.5}.wrap{max-width:980px;margin:auto;padding:18px 16px 55px}.home{display:inline-block;margin-bottom:12px;text-decoration:none;font-weight:900;color:#183153;background:#fff;border:2px solid #dde7ef;padding:8px 12px;border-radius:12px}.hero{border:3px solid #efc85e;border-radius:26px;padding:22px;background:linear-gradient(135deg,#fff3b8,#eee9ff 52%,#e8fff8)}h1{margin:0;font-size:clamp(2rem,5vw,3.3rem)}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:sticky;top:0;z-index:5;margin:14px 0;padding:8px;background:#fffffff0;border-radius:17px}.nav button,.btn{border:0;border-radius:13px;padding:11px 13px;font-weight:900;cursor:pointer}.nav button.active,.primary{color:#fff;background:linear-gradient(90deg,#7b6cf6,#43c6ac)}.secondary{background:#edf2f7;color:#183153}.view{display:none}.view.active{display:block}.card,.modebox,.quiz{background:#fff;border:2px solid #e3eaf1;border-radius:20px;margin:13px 0;overflow:hidden;box-shadow:0 6px 18px #18315310}.cardhead,.quiztop{padding:13px 16px;background:linear-gradient(90deg,#eef8ff,#f6efff);font-weight:900}.cardbody,.modebox,.qbody{padding:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.mini{border:2px solid #e5ebf2;border-radius:14px;padding:11px}.note{margin-top:10px;padding:10px 12px;border-radius:13px;background:#fff8d9;border:2px solid #efd36b;font-weight:800}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:6px 9px;border-radius:99px;background:#edf6ff;font-weight:900}.status,.qactions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.progress{height:12px;background:#e8edf3;border-radius:99px;overflow:hidden;margin-top:8px}.bar{height:100%;background:linear-gradient(90deg,#7b6cf6,#43c6ac,#ffd25d)}.topic,.difficulty{display:inline-block;padding:5px 8px;border-radius:99px;background:#eaf5ff;font-weight:900;font-size:.85rem}.difficulty{background:#f4f0ff;margin-left:5px}.question{font-size:1.2rem;font-weight:900;margin:12px 0}.answers{display:grid;gap:8px}.ans{width:100%;text-align:left;border:2px solid #dfe7ef;background:#fff;border-radius:13px;padding:11px;font-weight:800}.ans.correct{background:#edfbf2;border-color:#41b875}.ans.wrong{background:#fff1f2;border-color:#e55e6a}.textrow{display:flex;gap:8px}.textrow input{flex:1;border:2px solid #dfe7ef;border-radius:12px;padding:11px}.feedback{display:none;margin:0 16px 12px;padding:10px 12px;border-radius:12px;font-weight:900}.feedback.good{display:block;background:#edfbf2}.feedback.bad{display:block;background:#fff1f2}.qactions{padding:0 16px 16px}.result{text-align:center;padding:20px}.score{font-size:3.5rem;font-weight:900}.history{width:100%;border-collapse:collapse}.history td,.history th{padding:8px;border-bottom:1px solid #e1e8ef;text-align:left}.meter{height:9px;background:#e7edf3;border-radius:99px;overflow:hidden}.meter span{display:block;height:100%;background:#7b6cf6}.empty{padding:18px;text-align:center;border:2px dashed #ccd9e5;border-radius:14px}@media(max-width:700px){.nav{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.textrow{flex-direction:column}}</style></head><body><div class="wrap"><a class="home" href="index.html">← All Subjects</a><header class="hero"><h1 id="subjectTitle"></h1><p id="subjectSub"></p></header><nav class="nav"><button class="active" data-view="learn">📚 Learn</button><button data-view="practice">🎮 Practice</button><button data-view="daily">🎯 Today's Quiz</button><button data-view="results">📊 Results</button></nav><section id="learn" class="view active"><div id="reviewerHost"></div></section><section id="practice" class="view"><div class="modebox"><h2>🎮 Math Practice</h2><p>Unlimited mixed practice across the Math topics.</p><button class="btn primary" id="practiceStart">New Practice Set</button> <button class="btn secondary" id="mistakeStart">Practice My Mistakes</button></div><div id="practiceHost"></div></section><section id="daily" class="view"><div class="modebox"><h2>🎯 Today's Math Quiz</h2><p id="todayText"></p><button class="btn primary" id="dailyStart">Start Today's Quiz</button></div><div id="dailyHost"></div></section><section id="results" class="view"><div class="modebox"><h2>📊 Math Results</h2><div id="resultsHost"></div></div></section></div><script src="math-core.js"></script><script src="math-review-1.js"></script><script src="math-review-2.js"></script><script src="math-review-3.js"></script><script src="math-q1.js"></script><script src="math-q2.js"></script><script src="math-q3.js"></script><script src="math-q4.js"></script><script src="math-q5.js"></script><script src="math-q6.js"></script><script src="math-q7.js"></script><script src="math-review-4.js"></script><script src="math-review-5.js"></script><script src="math-q8.js"></script><script src="math-q9.js"></script><script src="math-q10.js"></script><script src="math-q11.js"></script><script src="math-q12.js"></script><script src="math-q13.js"></script><script src="math-q14.js"></script><script src="math-app.js"></script></body></html>
